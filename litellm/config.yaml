general_settings:
    master_key: os.environ/LITELLM_MASTER_KEY
    database_url: os.environ/LITELLM_DATABASE_URL
    store_prompts_in_spend_logs: true
  
model_list:

  - model_name: gpt-5-mini
    litellm_params:
      model: openai/gpt-5-mini
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      access_groups: ["free", "pro", "enterprise"]


  - model_name: gpt-5.4
    litellm_params:
      model: openai/gpt-5.4
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      access_groups: ["pro", "enterprise"]

  - model_name: text-embedding-3-small
    litellm_params:
      model: openai/text-embedding-3-small
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      access_groups: ["free", "pro", "enterprise"]
      tags: ["do-not-display"]

  - model_name: whisper-1
    litellm_params:
      model: openai/whisper-1
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      access_groups: ["free", "pro", "enterprise"]
      tags: ["do-not-display"]

  - model_name: gpt-4o-mini-tts
    litellm_params:
      model: openai/gpt-4o-mini-tts
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      access_groups: ["free", "pro", "enterprise"]
      tags: ["do-not-display"]

  - model_name: claude-sonnet-4-6
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info:
      access_groups: ["pro", "enterprise"]
      

  - model_name: claude-haiku-4-5-20251001
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info:
      access_groups: ["free", "pro", "enterprise"]
      tags: ["default"]


  - model_name: claude-opus-4-6
    litellm_params:
      model: anthropic/claude-opus-4-6
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info:
      access_groups: ["pro", "enterprise"]


  - model_name: gemini-3.1-pro-preview
    litellm_params:
      model: gemini/gemini-3.1-pro-preview
      api_key: os.environ/GOOGLE_API_KEY
    model_info:
      access_groups: ["pro", "enterprise"]


  - model_name: gemini-3-flash-preview
    litellm_params:
      model: gemini/gemini-3-flash-preview
      api_key: os.environ/GOOGLE_API_KEY
    model_info:
      access_groups: ["free", "pro", "enterprise"]

##LEGACY MODELS
# These models are kept for legacy apps that still use them.
# The legacy apps can use these models, but they cannot be used by new apps. 
# If the legacy API ever leaves support, then it will fall back to the fallback model if it is in the router_settings.
# Make sure all legacy models have fallbacks.

  - model_name: gemini-2.5-pro
    litellm_params:
      model: gemini/gemini-2.5-pro
      api_key: os.environ/GOOGLE_API_KEY
    model_info:
      access_groups: ["legacy"]


  - model_name: gemini-2.5-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GOOGLE_API_KEY
    model_info:
      access_groups: ["legacy"]

  - model_name: claude-sonnet-4-5-20250929
    litellm_params:
      model: anthropic/claude-sonnet-4-5-20250929
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info:
      access_groups: ["legacy"]

  - model_name: claude-opus-4-1-20250805
    litellm_params:
      model: anthropic/claude-opus-4-1-20250805
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info:
      access_groups: ["legacy"]

  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      access_groups: ["legacy"]

  - model_name: gpt-5.1
    litellm_params:
      model: openai/gpt-5.1
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      access_groups: ["legacy"]

  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      access_groups: ["legacy"]

  - model_name: gpt-5
    litellm_params:
      model: openai/gpt-5
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      access_groups: ["legacy"]

  - model_name: bad_model_name
    litellm_params:
      model: openai/bad_model_name
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      access_groups: ["legacy"]


litellm_settings:
    drop_params: true
    set_verbose: false
    default_fallbacks: ["gpt-5-mini"]

router_settings:
    ## IMPORTANT: both the keys and the values here must be `model_name` values from
    ## model_list above (the public model group), NOT the provider-prefixed
    ## `litellm_params.model` value. A key like "gemini/gemini-2.5-flash" never matches,
    ## because the model group is "gemini-2.5-flash" — the entry is silently ignored and
    ## the request fails with "Available Model Group Fallbacks=None".
    ##
    ## Every model in model_list needs an entry, not just the legacy ones.
    ## Fallbacks cross providers on purpose: a Google or OpenAI outage should land
    ## somewhere else. Targets stay inside the same access_groups tier so a free-tier
    ## request never falls back onto a pro-only model.
    fallbacks: [
## CURRENT MODELS
      {"gemini-3-flash-preview": ["claude-haiku-4-5-20251001", "gpt-5-mini"]},
      {"gemini-3.1-pro-preview": ["claude-sonnet-4-6", "gpt-5.4"]},
      {"claude-sonnet-4-6": ["gpt-5.4"]},
      {"claude-opus-4-6": ["claude-sonnet-4-6", "gpt-5.4"]},
      {"gpt-5.4": ["claude-sonnet-4-6"]},
      {"gpt-5-mini": ["claude-haiku-4-5-20251001"]},
      {"claude-haiku-4-5-20251001": ["gpt-5-mini"]},
## LEGACY MODELS
      {"gemini-2.5-pro": ["gpt-5-mini"]},
      {"gemini-2.5-flash": ["gpt-5-mini"]},
      {"claude-sonnet-4-5-20250929": ["gpt-5-mini"]},
      {"claude-opus-4-1-20250805": ["gpt-5-mini"]},
      {"gpt-4o-mini": ["gpt-5-mini"]},
      {"gpt-5.1": ["gpt-5-mini"]},
      {"gpt-4o": ["gpt-5-mini"]},
      {"gpt-5": ["gpt-5.1"]},
      {"bad_model_name": ["gpt-5-mini"]},
    ]

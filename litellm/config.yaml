general_settings:
    master_key: os.environ/LITELLM_MASTER_KEY
    database_url: os.environ/LITELLM_DATABASE_URL
    store_prompts_in_spend_logs: true
  
model_list:
  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      access_groups: ["free", "pro", "enterprise"]


  - model_name: gpt-5
    litellm_params:
      model: openai/gpt-5
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      access_groups: ["pro", "enterprise"]


  - model_name: gpt-5-mini
    litellm_params:
      model: openai/gpt-5-mini
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      access_groups: ["free", "pro", "enterprise"]


  - model_name: claude-sonnet-4-5-20250929
    litellm_params:
      model: anthropic/claude-sonnet-4-5-20250929
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info:
      access_groups: ["pro", "enterprise"]


  - model_name: claude-haiku-4-5-20251001
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info:
      access_groups: ["free", "pro", "enterprise"]


  - model_name: claude-opus-4-1-20250805
    litellm_params:
      model: anthropic/claude-opus-4-1-20250805
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info:
      access_groups: ["pro", "enterprise"]


  - model_name: gemini-2.5-pro
    litellm_params:
      model: gemini/gemini-2.5-pro
      api_key: os.environ/GOOGLE_API_KEY
    model_info:
      access_groups: ["pro", "enterprise"]


  - model_name: gemini-2.5-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GOOGLE_API_KEY
    model_info:
      access_groups: ["free", "pro", "enterprise"]


litellm_settings:
    drop_params: true
    set_verbose: false
    fallbacks: [
      {"openai/gpt-4o-mini": ["openai/gpt-5-mini"]},
      {"openai/gpt-5": ["openai/gpt-5-mini"]},
      {"anthropic/claude-sonnet-4-5-20250929": ["openai/gpt-5-mini"]},
      {"anthropic/claude-haiku-4-5-20251001": ["openai/gpt-5-mini"]},
      {"anthropic/claude-opus-4-1-20250805": ["openai/gpt-5-mini"]},
      {"gemini/gemini-2.5-pro": ["openai/gpt-5-mini"]},
      {"gemini/gemini-2.5-flash": ["openai/gpt-5-mini"]},
      {"perplexity/sonar-pro": ["openai/gpt-5-mini"]}
    ]

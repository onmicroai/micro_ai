# \micro_ai\docker-compose.prod.yml

services:
  db:
    container_name: db
    # pgvector is required for microapps.0061_rag_filesource_schema (CREATE EXTENSION vector).
    image: pgvector/pgvector:pg16
    # persist data beyond lifetime of container
    volumes:
      - /docker/volumes/postgres/:/var/lib/postgresql/data/
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      - POSTGRES_DB=${DATABASE_NAME}
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
    ports:
      - "5432:5432"
    networks:
      micronet:
        ipv4_address: 172.25.0.2

    healthcheck:
      test: pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}
      interval: 2s
      retries: 10
  web-staging:
    container_name: web-staging
    image: web:latest
    build:
      context: ./backend
      dockerfile: Dockerfile.web
    volumes:
      - ./backend:/code
      - media_data:/code/media
    expose:
      - "8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DEBUG=1
      - EMAIL_HOST=${EMAIL_HOST:-host.docker.internal}
      - EMAIL_PORT=${EMAIL_PORT:-25}
    env_file:
      - ./.env
    restart: unless-stopped
    networks:
      micronet:
        ipv4_address: 172.25.0.11
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: curl --fail http://localhost:8000/ || exit 1
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

  # LiteLLM
  litellm:
    image: ghcr.io/berriai/litellm-database:main-stable
    container_name: litellm
    ports:
      - "4000:4000"
    env_file:
      - ./.env
    volumes:
      - ./litellm/config.yaml:/app/config.yaml
    networks:
      micronet:
        ipv4_address: 172.25.0.14
    command: [ "--config", "/app/config.yaml", "--host", "0.0.0.0", "--port", "4000" ]
    init: true

  web:
    container_name: web
    image: web:latest
    volumes:
      - ./backend:/code
      - media_data:/code/media
    expose:
      - "8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DEBUG=1
      - EMAIL_HOST=${EMAIL_HOST:-host.docker.internal}
      - EMAIL_PORT=${EMAIL_PORT:-25}
    env_file:
      - ./.env
    restart: unless-stopped
    networks:
      micronet:
        ipv4_address: 172.25.0.15
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: curl --fail http://localhost:8000/ || exit 1
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

  theme-cron:
    container_name: theme-cron
    image: web:latest
    volumes:
      - ./backend:/code
      - media_data:/code/media
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DEBUG=1
      - EMAIL_HOST=${EMAIL_HOST:-host.docker.internal}
      - EMAIL_PORT=${EMAIL_PORT:-25}
    env_file:
      - ./.env
    command: >
      sh -c "while true; do
      python manage.py generate_app_themes;
      sleep 86400;
      done"
    restart: unless-stopped
    networks:
      micronet:
        ipv4_address: 172.25.0.16
    depends_on:
      db:
        condition: service_healthy
      litellm:
        condition: service_started
      web:
        condition: service_healthy
  frontend-staging:
    container_name: frontend-staging
    image: frontend-staging:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        - NEXT_PUBLIC_CLOUDFRONT_DOMAIN=${NEXT_PUBLIC_CLOUDFRONT_DOMAIN}
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEXT_PUBLIC_STRIPE_PUBLIC_KEY=${STRIPE_PUBLIC_KEY}
        - NEXT_PUBLIC_STRIPE_PRICING_TABLE_ID=${NEXT_PUBLIC_STRIPE_PRICING_TABLE_ID}
        - NEXT_PUBLIC_LOGO_FILENAME=${NEXT_PUBLIC_LOGO_FILENAME}
        - NEXT_PUBLIC_PLATFORM_NAME=${NEXT_PUBLIC_PLATFORM_NAME}
    expose:
      - "3000"
    volumes:
      - ./frontend:/frontend
      - /frontend/node_modules
      - /frontend/.next
    networks:
      micronet:
        ipv4_address: 172.25.0.20
    env_file:
      - ./.env
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    user: "1000:1000" # ubuntu:ubuntu user:group

  frontend:
    container_name: frontend
    image: frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        - NEXT_PUBLIC_CLOUDFRONT_DOMAIN=${NEXT_PUBLIC_CLOUDFRONT_DOMAIN}
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEXT_PUBLIC_STRIPE_PUBLIC_KEY=${STRIPE_PUBLIC_KEY}
        - NEXT_PUBLIC_STRIPE_PRICING_TABLE_ID=${NEXT_PUBLIC_STRIPE_PRICING_TABLE_ID}
        - NEXT_PUBLIC_LOGO_FILENAME=${NEXT_PUBLIC_LOGO_FILENAME}
        - NEXT_PUBLIC_PLATFORM_NAME=${NEXT_PUBLIC_PLATFORM_NAME}
    expose:
      - "3000"
    volumes:
      - ./frontend:/frontend
      - /frontend/node_modules
      - /frontend/.next
    networks:
      micronet:
        ipv4_address: 172.25.0.21
    env_file:
      - ./.env
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    user: "1000:1000" # ubuntu:ubuntu user:group

volumes:
  media_data:

networks:
  micronet:
    external: true
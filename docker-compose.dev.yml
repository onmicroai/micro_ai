# Dev server compose
#
# Profiles:
#   (none)  — db only. DB is never stopped by CI/CD.
#   app     — full stack: litellm, web, theme-cron, frontend
#
# Usage:
#   Start everything:   docker compose --profile app up -d
#   Start db only:      docker compose up -d db
#   Stop app (not db):  docker compose --profile app down
#   View logs:          docker compose --profile app logs -f

services:
  db:
    # No profile — db is always available and is never touched by deployments.
    # Data lives on the host at /docker/volumes/postgres/ (bind mount, not a
    # Docker named volume), so it is immune to `docker volume prune`.
    container_name: db
    image: pgvector/pgvector:pg17
    volumes:
      - /docker/volumes/postgres/:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=${DATABASE_NAME}
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      micronet:
        ipv4_address: 172.25.0.2
    healthcheck:
      test: pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}
      interval: 2s
      retries: 10

  litellm:
    profiles: [app]
    image: ghcr.io/berriai/litellm-database:main-stable
    container_name: litellm
    ports:
      - "4000:4000"
    env_file:
      - ./.env
    volumes:
      - ./litellm/config.yaml:/app/config.yaml
    networks:
      micronet:
        ipv4_address: 172.25.0.14
    command:
      ["--config", "/app/config.yaml", "--host", "0.0.0.0", "--port", "4000"]
    init: true
    restart: unless-stopped

  web:
    profiles: [app]
    # Explicit image tag so CI/CD can reliably retag for rollback.
    image: microai-dev-web:latest
    container_name: web
    # bash required — dash (sh) does not support pipefail in docker_startup.sh
    command: ["bash", "/code/deploy/docker_startup.sh"]
    build:
      context: ./backend
      dockerfile: Dockerfile.web
    volumes:
      - ./backend:/code
      - media_data:/code/media
    expose:
      - "8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DEBUG=1
      - DJANGO_SETTINGS_MODULE=micro_ai.settings
      - EMAIL_HOST=${EMAIL_HOST:-host.docker.internal}
      - EMAIL_PORT=${EMAIL_PORT:-25}
    env_file:
      - ./.env
    restart: unless-stopped
    networks:
      micronet:
        ipv4_address: 172.25.0.11
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: curl --fail http://localhost:8000/health/ || exit 1
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 120s

  theme-cron:
    profiles: [app]
    # Reuses the web image — same Dockerfile, different command.
    image: microai-dev-web:latest
    container_name: theme-cron
    command: >
      sh -c "while true; do
      python manage.py generate_app_themes;
      sleep 86400;
      done"
    volumes:
      - ./backend:/code
      - media_data:/code/media
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DEBUG=1
      - EMAIL_HOST=${EMAIL_HOST:-host.docker.internal}
      - EMAIL_PORT=${EMAIL_PORT:-25}
    env_file:
      - ./.env
    restart: unless-stopped
    networks:
      micronet:
        ipv4_address: 172.25.0.12
    depends_on:
      db:
        condition: service_healthy
      litellm:
        condition: service_started
      web:
        condition: service_healthy

  frontend:
    profiles: [app]
    # Explicit image tag so CI/CD can reliably retag for rollback.
    image: microai-dev-frontend:latest
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        - NEXT_PUBLIC_CLOUDFRONT_DOMAIN=${NEXT_PUBLIC_CLOUDFRONT_DOMAIN}
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEXT_PUBLIC_STRIPE_PUBLIC_KEY=${STRIPE_PUBLIC_KEY}
        - NEXT_PUBLIC_STRIPE_PRICING_TABLE_ID=${NEXT_PUBLIC_STRIPE_PRICING_TABLE_ID}
        - NEXT_PUBLIC_LOGO_FILENAME=${NEXT_PUBLIC_LOGO_FILENAME}
        - NEXT_PUBLIC_PLATFORM_NAME=${NEXT_PUBLIC_PLATFORM_NAME}
    expose:
      - "3000"
    networks:
      micronet:
        ipv4_address: 172.25.0.20
    env_file:
      - ./.env
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    user: "1000:1000"

volumes:
  media_data:

networks:
  micronet:
    external: true

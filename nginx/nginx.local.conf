# \microai-frontend\nginx.conf
# \microai-frontend\nginx.conf
server {
    listen 80;
    client_max_body_size 25M;

    # Redirects (add trailing slashes)
    rewrite ^/accounts/password/change$ /accounts/password/change/ permanent;
    rewrite ^/users/profile$ /users/profile/ permanent;
    rewrite ^/a/([^/]+)/subscription$ /a/$1/subscription/ permanent;
    rewrite ^/accounts/logout_loading$ /accounts/logout_loading/ permanent;

    # ✅ Allow iframe embedding ONLY for /app/embed/ paths
    location ~ ^/app/embed/ {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Allow embedding from any domain (change '*' to specific domains if needed)
        add_header Content-Security-Policy "frame-ancestors *" always;
        proxy_hide_header X-Frame-Options;
    }    

    # Next.js frontend
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for Next.js
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;     
    }

    # ✅ Allow iframe embedding for LTI login and launch paths
    location ~ ^/lti/(login|launch)/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Allow embedding from your LTI consumer
        add_header Content-Security-Policy "frame-ancestors *" always;
        proxy_hide_header X-Frame-Options;
    }

    # Django backend
    location ~ ^/(api|static|media|admin|stripe|lti) {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (optional, but safe to include)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Disable buffering for streaming responses (SSE, etc.)
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;

        # Slow LLM / SSE: default proxy_read_timeout is 60s and drops long streams
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;        
    }
}


# \micro_ai\docker-compose.yml

services:
  db:
    container_name: db
    image: pgvector/pgvector:pg17
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=${DATABASE_NAME}
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
    ports:
      - "25432:5432"
    networks:
      - microaiNetwork
    healthcheck:
      test: pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}
      interval: 5s
      retries: 20

  # LiteLLM for local
  om-litellm:
    image: ghcr.io/berriai/litellm-database:main-stable
    container_name: om-litellm
    ports:
      - "8008:4000"
    env_file:
      - .env
    volumes:
      - ./litellm/config.yaml:/app/config.yaml
    networks:
      - microaiNetwork
    command:
      ["--config", "/app/config.yaml", "--host", "0.0.0.0", "--port", "4000"]
    init: true

  web:
    container_name: web
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: sh -c "python manage.py migrate && uvicorn micro_ai.asgi:application --host 0.0.0.0 --port 8000 --reload --reload-dir /code"
    volumes:
      - ./backend:/code
      - media_data:/code/media
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    restart: unless-stopped
    networks:
      - microaiNetwork
    depends_on:
      db:
        condition: service_healthy
      om-litellm:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; socket.create_connection(('localhost', 8000), timeout=1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
  frontend:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "3000"
    volumes:
      - ./frontend:/frontend
      - /frontend/node_modules
    networks:
      - microaiNetwork
    env_file:
      - ./.env
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "const http = require(''http''); const options = { host: ''localhost'', port: 3000, path: ''/'', timeout: 2000 }; const request = http.request(options, (res) => { process.exit(res.statusCode === 200 ? 0 : 1); }); request.on(''error'', () => process.exit(1)); request.end();"',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  theme-cron:
    container_name: theme-cron
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: >
      sh -c "while true; do
      python manage.py generate_app_themes;
      sleep 86400;
      done"
    volumes:
      - ./backend:/code
      - media_data:/code/media
    env_file:
      - ./.env
    restart: unless-stopped
    networks:
      - microaiNetwork
    depends_on:
      db:
        condition: service_healthy
      om-litellm:
        condition: service_started
      web:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.local.conf:/etc/nginx/conf.d/default.conf
    networks:
      - microaiNetwork
    depends_on:
      frontend:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  postgres_data:
  static:
  media_data:

networks:
  microaiNetwork:
    driver: bridge

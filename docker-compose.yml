# \micro_ai\docker-compose.yml

services:
  db:
    container_name: db
    image: pgvector/pgvector:pg17
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      - POSTGRES_DB=${DATABASE_NAME}
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
    ports:
      - "25432:5432"
    networks:
      - microaiNetwork
    healthcheck:
      test: pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}
      interval: 5s
      retries: 20

  # LiteLLM for local
  om-litellm:
    image: ghcr.io/berriai/litellm-database:1.89.3
    container_name: om-litellm
    ports:
      - "8008:4000"
    env_file:
      - .env
    environment:
      - LITELLM_DATABASE_URL=postgresql://${DATABASE_USER}:${DATABASE_PASSWORD}@db:5432/litellm
    volumes:
      - ./litellm/config.yaml:/app/config.yaml
    networks:
      - microaiNetwork
    depends_on:
      db:
        condition: service_healthy
    command:
      ["--config", "/app/config.yaml", "--host", "0.0.0.0", "--port", "4000"]
    init: true

  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--http-relative-path=/auth"]
    environment:
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://db:5432/keycloak
      - KC_DB_USERNAME=${DATABASE_USER}
      - KC_DB_PASSWORD=${DATABASE_PASSWORD}
      # A full URL here must include the relative path — Keycloak only
      # auto-appends KC_HTTP_RELATIVE_PATH when this is a bare hostname.
      - KC_HOSTNAME=${DOMAIN}/auth
      - KC_HOSTNAME_STRICT=false
      - KC_HTTP_ENABLED=true
      - KC_PROXY_HEADERS=xforwarded
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "8180:8080"
    volumes:
      # Run keycloak/fetch-provider.sh first — see keycloak/README.md.
      - ./keycloak/providers:/opt/keycloak/providers:ro
    # So the realm's smtpServer (import-realm.sh) can reach the same
    # Postfix-style relay on the host that Django's own mail already uses.
    # (Docker Desktop resolves this natively on Mac/Windows; host-gateway
    # is what makes it work identically on Linux, matching web's mapping.)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - microaiNetwork
    depends_on:
      db:
        condition: service_healthy

  web:
    container_name: web
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    # createcachetable is needed by DRF throttles (SimpleRateThrottle-based
    # classes in apps/utils/throttles.py use CACHES["default"], which is
    # DatabaseCache) — dev/prod already do this via deploy/docker_startup.sh.
    command: sh -c "python manage.py migrate && python manage.py createcachetable --noinput && uvicorn micro_ai.asgi:application --host 0.0.0.0 --port 8000 --reload --reload-dir /code"
    volumes:
      - ./backend:/code
      - media_data:/code/media
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      EMAIL_HOST: ${EMAIL_HOST:-host.docker.internal}
      EMAIL_PORT: ${EMAIL_PORT:-25}
    restart: unless-stopped
    networks:
      - microaiNetwork
    depends_on:
      db:
        condition: service_healthy
      om-litellm:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; socket.create_connection(('localhost', 8000), timeout=1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
  frontend:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "3000"
    volumes:
      - ./frontend:/frontend
      - /frontend/node_modules
    networks:
      - microaiNetwork
    env_file:
      - ./.env
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - INTERNAL_API_URL=http://web:8000
      - NEXT_PUBLIC_STRIPE_PUBLIC_KEY=${STRIPE_PUBLIC_KEY}
      - NEXT_PUBLIC_STRIPE_PRICING_TABLE_ID=${NEXT_PUBLIC_STRIPE_PRICING_TABLE_ID}
      - NEXT_PUBLIC_LOGO_FILENAME=${NEXT_PUBLIC_LOGO_FILENAME}
      - NEXT_PUBLIC_PLATFORM_NAME=${NEXT_PUBLIC_PLATFORM_NAME}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "const http = require(''http''); const options = { host: ''localhost'', port: 3000, path: ''/'', timeout: 2000 }; const request = http.request(options, (res) => { process.exit(res.statusCode === 200 ? 0 : 1); }); request.on(''error'', () => process.exit(1)); request.end();"',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  theme-cron:
    container_name: theme-cron
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: >
      sh -c "while true; do
      python manage.py generate_app_themes;
      sleep 86400;
      done"
    volumes:
      - ./backend:/code
      - media_data:/code/media
    env_file:
      - ./.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      EMAIL_HOST: ${EMAIL_HOST:-host.docker.internal}
      EMAIL_PORT: ${EMAIL_PORT:-25}
    restart: unless-stopped
    networks:
      - microaiNetwork
    depends_on:
      db:
        condition: service_healthy
      om-litellm:
        condition: service_started
      web:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.local.conf:/etc/nginx/conf.d/default.conf
      - media_data:/code/media:ro
    networks:
      - microaiNetwork
    depends_on:
      frontend:
        condition: service_healthy
      web:
        condition: service_healthy
      keycloak:
        condition: service_started

volumes:
  postgres_data:
  media_data:

networks:
  microaiNetwork:
    driver: bridge

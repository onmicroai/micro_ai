<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Select an app</title>
    <style>
        :root {
            color-scheme: light;
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 24px 16px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f8fafc;
            color: #1f2937;
        }
        .wrap {
            max-width: 640px;
            margin: 0 auto;
        }
        h1 {
            font-size: 1.25rem;
            margin: 0 0 4px;
        }
        p.subtitle {
            margin: 0 0 20px;
            color: #6b7280;
            font-size: 0.875rem;
        }
        .error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
            padding: 14px 16px;
            border-radius: 10px;
            font-size: 0.875rem;
            line-height: 1.5;
        }
        ul.apps {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        li.app {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 14px 16px;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }
        li.app:hover {
            border-color: #c7d2fe;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
        }
        .app-form {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin: 0;
        }
        .app-info {
            min-width: 0;
        }
        .app-title {
            font-weight: 600;
            font-size: 0.95rem;
            margin: 0 0 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .app-desc {
            margin: 0;
            color: #6b7280;
            font-size: 0.8125rem;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        button.select {
            flex-shrink: 0;
            background: #4f46e5;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s ease;
        }
        button.select:hover {
            background: #4338ca;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>Insert an app</h1>
        <p class="subtitle">Choose one of your apps to add to your course.</p>

        {% if error_message %}
            <div class="error">{{ error_message }}</div>
        {% else %}
            <ul class="apps">
                {% for app in microapps %}
                    <li class="app">
                        <form class="app-form" method="post" action="{% url 'app-deep-link-select' %}">
                            <input type="hidden" name="launch_id" value="{{ launch_id }}">
                            <input type="hidden" name="microapp_hash_id" value="{{ app.hash_id }}">
                            <div class="app-info">
                                <p class="app-title">{{ app.title }}</p>
                                {% if app.explanation %}
                                    <p class="app-desc">{{ app.explanation }}</p>
                                {% endif %}
                            </div>
                            <button type="submit" class="select">Insert</button>
                        </form>
                    </li>
                {% endfor %}
            </ul>
        {% endif %}
    </div>
</body>
</html>

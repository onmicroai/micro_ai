# Build WEB + FRONTEND on master push (pre-production validation)
name: CI/CD Build Production Images

on:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Pull master branch and ensure db is up
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: 'ubuntu'
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -euo pipefail
            cd /home/ubuntu/micro_ai
            git pull origin master

            if docker inspect db &>/dev/null; then
              docker start db 2>/dev/null || true
            else
              docker compose -f docker-compose.prod.yml up -d db
            fi

  build:
    name: Build Images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: prepare

    steps:
      - name: Build web and frontend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: 'ubuntu'
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -euo pipefail
            cd /home/ubuntu/micro_ai
            docker compose -f docker-compose.prod.yml build --no-cache web frontend

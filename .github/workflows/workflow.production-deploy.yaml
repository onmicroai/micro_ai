# Deploy WEB + FRONTEND + NGINX to Production
name: PRODUCTION DEPLOY(Prod Server) $$

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

env:
  APP_DIR: /home/ubuntu/micro_ai
  COMPOSE: docker compose -f /home/ubuntu/micro_ai/docker-compose.prod.yml

jobs:

  deploy:
    name: Deploy Containers
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Pull code
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: 'ubuntu'
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -euo pipefail
            cd "${{ env.APP_DIR }}"
            git pull origin master

      - name: Deploy with rolling recreate
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: 'ubuntu'
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -euo pipefail
            cd "${{ env.APP_DIR }}"
            COMPOSE="${{ env.COMPOSE }}"

            # --no-deps: never touch db/litellm during app deploy.
            # --force-recreate: swap containers without a separate stop/rm step.
            $COMPOSE up -d --force-recreate --no-deps keycloak
            $COMPOSE up -d --force-recreate --no-deps web

            echo "Waiting for web to become healthy..."
            WEB_WAIT=180
            WEB_ELAPSED=0
            WEB_STATUS=""
            while [ "$WEB_ELAPSED" -lt "$WEB_WAIT" ]; do
              WEB_STATUS=$(docker inspect --format='{{.State.Health.Status}}' web 2>/dev/null || echo "missing")
              WEB_STATE=$(docker inspect --format='{{.State.Status}}' web 2>/dev/null || echo "missing")
              echo "web: state=${WEB_STATE} health=${WEB_STATUS} (${WEB_ELAPSED}s)"

              if [ "$WEB_STATUS" = "healthy" ]; then
                break
              fi

              if [ "$WEB_STATE" = "exited" ] || [ "$WEB_STATE" = "dead" ]; then
                echo "web container exited — logs:"
                docker logs web --tail 80
                exit 1
              fi

              sleep 5
              WEB_ELAPSED=$((WEB_ELAPSED + 5))
            done

            if [ "$WEB_STATUS" != "healthy" ]; then
              echo "web did not become healthy within ${WEB_WAIT}s — logs:"
              docker logs web --tail 80
              exit 1
            fi
            echo "web is healthy."

            $COMPOSE up -d --force-recreate --no-deps theme-cron
            # -V recreates the anonymous .next volume so stale bundles are not reused
            $COMPOSE up -d --force-recreate --no-deps -V frontend
            $COMPOSE up -d --force-recreate --no-deps nginx

            echo "--- Deploy successful ---"

      - name: Apply Keycloak realm config
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: 'ubuntu'
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -euo pipefail
            cd "${{ env.APP_DIR }}"
            set -a; source .env; set +a
            ./keycloak/import-realm.sh

      - name: Clean up disk space
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: 'ubuntu'
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "Cleaning up Docker resources..."
            sudo docker container prune -f
            sudo docker image prune -a -f
            sudo docker builder prune -f

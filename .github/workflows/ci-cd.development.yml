# Deploy to Development Server
name: CI/CD Development

on:
  push:
    branches: [dev]

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

# Shared shorthand used in every SSH step.
env:
  COMPOSE: docker compose -f /home/ubuntu/micro_ai/docker-compose.dev.yml -p microai-dev

jobs:

  # ─────────────────────────────────────────────────────────────────────────────
  # 1. PREPARE
  #    Pull latest code, inject secrets, snapshot current images for rollback,
  #    and ensure the database is running.
  #    The DB has no profile and is never stopped by subsequent steps.
  # ─────────────────────────────────────────────────────────────────────────────
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Pull code, copy secrets, snapshot rollback images, ensure db is up
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP_DEV }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY_DEV }}
          port: 22
          script: |
            set -euo pipefail
            cd /home/ubuntu/micro_ai

            git pull origin dev

            # Snapshot currently running images as :rollback BEFORE we build
            # anything new. If the deploy later fails we can restore these.
            # The `|| true` ensures a missing image (first-ever deploy) doesn't fail.
            docker tag microai-dev-web:latest      microai-dev-web:rollback      2>/dev/null || true
            docker tag microai-dev-frontend:latest microai-dev-frontend:rollback 2>/dev/null || true

            # Ensure db is up and healthy.
            # `docker inspect db` succeeds whether the container belongs to
            # the old "backend" project or the new "microai-dev" project, so
            # we avoid a name-conflict error on the first run after migration.
            if docker inspect db &>/dev/null; then
              # Container already exists — just make sure it is started.
              docker start db 2>/dev/null || true
            else
              # First-ever deploy — let compose create it under microai-dev.
              ${{ env.COMPOSE }} up -d db
            fi

            # Wait for the healthcheck to pass before we start building.
            echo "Waiting for db to be healthy..."
            timeout 60 bash -c \
              'until docker inspect --format="{{.State.Health.Status}}" db 2>/dev/null | grep -q "healthy"; do sleep 2; done'
            echo "db is healthy."

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. BUILD  (parallel)
  #    Build each image independently on the server so the two longest steps
  #    don't block each other.
  # ─────────────────────────────────────────────────────────────────────────────
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: prepare
    steps:
      - name: Build frontend image
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP_DEV }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY_DEV }}
          port: 22
          script: |
            set -euo pipefail
            cd /home/ubuntu/micro_ai
            ${{ env.COMPOSE }} build frontend

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: prepare
    steps:
      - name: Build web image (shared by web + theme-cron)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP_DEV }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY_DEV }}
          port: 22
          script: |
            set -euo pipefail
            cd /home/ubuntu/micro_ai
            ${{ env.COMPOSE }} build web

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. DEPLOY  (with automatic rollback)
  #    Stop the old app containers, start the new ones, and wait for every
  #    healthcheck to pass.  If anything fails, the rollback() function fires
  #    via `trap` and restores the previously snapshotted images.
  #    The database is never touched here.
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build-frontend, build-web]
    steps:
      - name: Deploy with auto-rollback on failure
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP_DEV }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY_DEV }}
          port: 22
          script: |
            set -euo pipefail
            cd /home/ubuntu/micro_ai
            COMPOSE="${{ env.COMPOSE }}"

            # db has no profile, so --profile app up/down always tries to
            # manage it and hits a name conflict with the existing container.
            # We manage the app services by name instead, keeping db
            # completely out of the deploy step.
            APP="keycloak litellm web theme-cron frontend"

            # compose rm only removes containers this project owns.
            # Leftovers from another compose project (or a failed prior
            # deploy) keep the same container_name and then collide on up.
            # docker rm -f by name clears those regardless of project.
            remove_app() {
              $COMPOSE --profile app rm -sf $APP 2>/dev/null || true
              docker rm -f $APP 2>/dev/null || true
            }

            rollback() {
              echo "--- DEPLOY FAILED — rolling back to previous images ---"
              remove_app
              docker tag microai-dev-web:rollback      microai-dev-web:latest      2>/dev/null || true
              docker tag microai-dev-frontend:rollback microai-dev-frontend:latest 2>/dev/null || true
              # No --wait here to avoid looping if the rollback image is also broken.
              $COMPOSE --profile app up -d --no-deps $APP
              echo "--- Rollback complete ---"
            }
            trap rollback ERR

            # Stop and remove current app containers.
            remove_app

            # Start services in dependency order.
            # --no-deps: compose will not attempt to create/start db.
            # --profile app: web/frontend are behind the app profile.
            # Avoid `compose --wait` for web — it can report unhealthy before
            # start_period elapses; poll docker inspect instead (same as db).
            ./keycloak/fetch-provider.sh

            $COMPOSE --profile app up -d --no-deps litellm
            $COMPOSE --profile app up -d --no-deps keycloak
            $COMPOSE --profile app up -d --no-deps web

            echo "Waiting for web to become healthy..."
            WEB_WAIT=180
            WEB_ELAPSED=0
            WEB_STATUS=""
            while [ "$WEB_ELAPSED" -lt "$WEB_WAIT" ]; do
              WEB_STATUS=$(docker inspect --format='{{.State.Health.Status}}' web 2>/dev/null || echo "missing")
              WEB_STATE=$(docker inspect --format='{{.State.Status}}' web 2>/dev/null || echo "missing")
              echo "web: state=${WEB_STATE} health=${WEB_STATUS} (${WEB_ELAPSED}s)"

              if [ "$WEB_STATUS" = "healthy" ]; then
                break
              fi

              if [ "$WEB_STATE" = "exited" ] || [ "$WEB_STATE" = "dead" ]; then
                echo "web container exited — logs:"
                docker logs web --tail 80
                exit 1
              fi

              sleep 5
              WEB_ELAPSED=$((WEB_ELAPSED + 5))
            done

            if [ "$WEB_STATUS" != "healthy" ]; then
              echo "web did not become healthy within ${WEB_WAIT}s — logs:"
              docker logs web --tail 80
              exit 1
            fi
            echo "web is healthy."

            $COMPOSE --profile app up -d --no-deps theme-cron frontend

            echo "--- Deploy successful ---"

#      - name: Apply Keycloak realm config
#        uses: appleboy/ssh-action@v1.0.3
#        with:
#          host: ${{ secrets.SERVER_IP_DEV }}
#          username: ubuntu
#          key: ${{ secrets.SSH_PRIVATE_KEY_DEV }}
#          port: 22
#          script: |
#            set -euo pipefail
#            cd /home/ubuntu/micro_ai
#            set -a; source .env; set +a#
            ./keycloak/import-realm.sh

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. CLEAN  (only on successful deploy)
  #    Remove dangling images and unused build cache to prevent the server disk
  #    from filling up over time.  Named volumes are never pruned here.
  #    The postgres data is a host bind-mount so it is immune to volume prune.
  # ─────────────────────────────────────────────────────────────────────────────
  clean:
    name: Clean
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: deploy
    if: success()
    steps:
      - name: Prune unused Docker resources
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP_DEV }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY_DEV }}
          port: 22
          script: |
            echo "Pruning unused Docker resources..."

            # Stopped containers
            docker container prune -f

            # Dangling (untagged) images — keeps :latest and :rollback intact
            docker image prune -f

            # Stale build cache
            docker builder prune -f

            # Named volumes not attached to any container.
            # media_data is attached to running web/theme-cron → safe.
            # The postgres data is a host bind-mount, not a named volume → safe.
            docker volume prune -f

            echo "Disk usage after cleanup:"
            df -h /

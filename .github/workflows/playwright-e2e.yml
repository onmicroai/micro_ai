name: Playwright E2E Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - master

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env file
        run: |
          cat > .env << EOF
          DATABASE_NAME=test_db
          DATABASE_USER=postgres
          DATABASE_PASSWORD=postgres
          SECRET_KEY=test-secret-key-for-ci
          DEBUG=1
          DOMAIN=http://localhost
          NEXT_PUBLIC_API_URL=http://localhost:8000
          NEXT_PUBLIC_CLOUDFRONT_DOMAIN=
          NEXT_PUBLIC_OPENAI_COST_PER_CHARACTER=0.00001
          EOF

      - name: Start Docker Compose services
        run: |
          docker compose up -d --build

      - name: Wait for database to be ready
        run: |
          timeout 60 bash -c 'until docker compose exec -T db pg_isready -U postgres -d test_db; do sleep 2; done'

      - name: Wait for backend to be ready
        run: |
          echo "Waiting for backend to be ready..."
          timeout 180 bash -c 'until curl -f http://localhost:8000/api/schema/ > /dev/null 2>&1; do echo "Waiting for backend..."; sleep 5; done'
          echo "Backend is ready!"

      - name: Wait for frontend to be ready
        run: |
          echo "Waiting for frontend to be ready..."
          timeout 180 bash -c 'until curl -f http://localhost:3000/ > /dev/null 2>&1; do echo "Waiting for frontend..."; sleep 5; done'
          echo "Frontend is ready!"

      - name: Wait for nginx to be ready
        run: |
          echo "Waiting for nginx to be ready..."
          timeout 60 bash -c 'until curl -f http://localhost/ > /dev/null 2>&1; do echo "Waiting for nginx..."; sleep 5; done'
          echo "Nginx is ready!"

      - name: Run database migrations
        run: |
          echo "Running database migrations..."
          docker compose exec -T web python manage.py migrate
          echo "Migrations completed!"

      - name: Seed test data
        run: |
          echo "Seeding test data..."
          docker compose exec -T web python manage.py seed_test_data
          echo "Test data seeded!"

      - name: Install Playwright Browsers
        working-directory: ./frontend
        run: |
          npm ci
          npx playwright install --with-deps

      - name: Run Playwright tests
        working-directory: ./frontend
        run: |
          npx playwright test || exit 1
        env:
          CI: true
        continue-on-error: false

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: frontend/test-results/
          retention-days: 30

      - name: Cleanup
        if: always()
        run: |
          docker compose down -v


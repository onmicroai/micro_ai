# Run Playwright E2E after DEVELOPMENT deployment succeeds only.
# CI/CD Staging (Prod Server) will NOT trigger this workflow.

name: Playwright E2E After Deploy

on:
  workflow_run:
    workflows:
      - "CI/CD Development(Dev Server)"
    types:
      - completed

jobs:
  playwright:
    name: E2E vs deployed DEV env
    # Only run when the DEV deployment workflow succeeded
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps

      # Development deploy succeeded → run E2E against dev
      - name: Run Playwright (dev)
        if: github.event.workflow_run.name == 'CI/CD Development(Dev Server)'
        working-directory: ./frontend
        run: npx playwright test || exit 1
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: https://dev.onmicro.ai
          PLAYWRIGHT_API_BASE_URL: https://dev.onmicro.ai

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-after-deploy
          path: frontend/playwright-report/
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-after-deploy
          path: frontend/test-results/
          retention-days: 14

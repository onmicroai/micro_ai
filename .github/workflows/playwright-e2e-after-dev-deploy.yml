# Run Playwright E2E after DEVELOPMENT deployment succeeds only.

name: Playwright E2E After DEV Deploy

on:
  workflow_run:
    workflows:
      - "CI/CD Development"
    types:
      - completed

jobs:
  playwright:
    name: E2E vs deployed DEV env
    # Only run when the DEV deployment workflow succeeded
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps

      # Download .env file from dev server (same as deployment workflow uses)
      - name: Download .env file from dev server
        if: github.event.workflow_run.name == 'CI/CD Development(Dev Server)'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY_DEV }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_IP_DEV }} >> ~/.ssh/known_hosts 2>/dev/null || true

          # Download .env file from server (same location as deployment workflow)
          ssh ubuntu@${{ secrets.SERVER_IP_DEV }} 'if [ -f "/opt/secrets/.env" ]; then cat /opt/secrets/.env; elif [ -f "/home/ubuntu/micro_ai/.env" ]; then cat /home/ubuntu/micro_ai/.env; else echo "# .env file not found on server"; fi' > ./frontend/.env

          echo "✅ Downloaded .env file from dev server"

      # Development deploy succeeded → run E2E against dev
      - name: Run Playwright (dev)
        if: github.event.workflow_run.name == 'CI/CD Development(Dev Server)'
        working-directory: ./frontend
        run: npx playwright test || exit 1
        env:
          CI: true
          TARGET_ENV: dev

      - name: Generate test summary
        if: always()
        working-directory: ./frontend
        run: |
          echo "## 🎭 Playwright E2E Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f playwright-report/results.json ]; then
            # Parse JSON and extract summary (requires node)
            if command -v node &> /dev/null; then
              node -e "
                const fs = require('fs');
                const data = JSON.parse(fs.readFileSync('playwright-report/results.json', 'utf8'));
                const stats = data.stats || {};
                const total = stats.total || 0;
                const passed = stats.expected || 0;
                const failed = stats.unexpected || 0;
                const skipped = stats.skipped || 0;
                const duration = stats.duration || 0;
                
                console.log(\`### Test Summary\`);
                console.log(\`- **Total:** \${total} tests\`);
                console.log(\`- **Passed:** ✅ \${passed}\`);
                console.log(\`- **Failed:** ❌ \${failed}\`);
                console.log(\`- **Skipped:** ⏭️ \${skipped}\`);
                console.log(\`- **Duration:** \${Math.round(duration / 1000)}s\`);
                console.log('');
                
                if (failed > 0) {
                  console.log('### ❌ Failed Tests');
                  const failedTests = data.suites?.flatMap(s => s.specs?.filter(sp => sp.tests?.some(t => t.results?.some(r => r.status === 'failed'))) || []) || [];
                  failedTests.forEach(spec => {
                    const test = spec.tests?.find(t => t.results?.some(r => r.status === 'failed'));
                    if (test) {
                      console.log(\`- **\${spec.title}** (\${spec.file})\`);
                    }
                  });
                }
              " >> $GITHUB_STEP_SUMMARY || echo "Could not parse test results JSON" >> $GITHUB_STEP_SUMMARY
            fi
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- **HTML Report:** Available in \`playwright-html-report-after-deploy\` artifact" >> $GITHUB_STEP_SUMMARY
          echo "- **JSON Report:** Available in \`playwright-json-report-after-deploy\` artifact" >> $GITHUB_STEP_SUMMARY
          echo "- **JUnit Report:** Available in \`playwright-junit-report-after-deploy\` artifact" >> $GITHUB_STEP_SUMMARY
          echo "- **Test Results:** Screenshots, videos, traces in \`playwright-test-results-after-deploy\` artifact" >> $GITHUB_STEP_SUMMARY

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report-after-deploy
          path: frontend/playwright-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Playwright JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-json-report-after-deploy
          path: frontend/playwright-report/results.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Playwright JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-junit-report-after-deploy
          path: frontend/playwright-report/junit.xml
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload test results (screenshots, videos, traces)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-after-deploy
          path: frontend/test-results/
          retention-days: 30
          if-no-files-found: ignore

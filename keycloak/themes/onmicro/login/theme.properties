# Extends the stock Keycloak 26 login theme (PatternFly-based) — only
# overriding the background, so every page (login, register, verify email,
# reset password, ...) inherits everything else from keycloak.v2 unchanged.
parent=keycloak.v2
import=common/keycloak

styles=css/onmicro.css

# Strips the parent theme's prefers-color-scheme dark class — see the file's
# own header for why this is JS and not more CSS.
scripts=js/light-mode.js
